name: Angular_DockerImage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  angular_deploy:
    runs-on: ubuntu-latest
    
    steps:
      # --- Acciones actualizadas (más recientes) ---
      - uses: actions/checkout@v4      # ✅ Antes era @v2
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4   # ✅ Antes era @v1
        with:
          node-version: 20.x
          
      - name: npm install
        run: npm install --legacy-peer-deps

      - name: build
        run: npm run build --prod
        
      - name: list dist folder
        run: ls -R dist

      - name: docker login
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Run httpd container
        run: docker run -d --name http_base httpd

      - name: Copy files to container
        run: |
          if [ -d "dist/lifegoals/browser" ]; then
            docker cp dist/lifegoals/browser/. http_base:/usr/local/apache2/htdocs
          else
            docker cp dist/lifegoals/. http_base:/usr/local/apache2/htdocs
          fi

      - name: Commit and push image
        run: |
          docker commit --change "ENV MODEL_NAME http_base" http_base ${{secrets.DOCKER_USER}}/lifegoals:${{ github.sha }}
          docker tag ${{secrets.DOCKER_USER}}/lifegoals:${{ github.sha }} ${{secrets.DOCKER_USER}}/lifegoals:latest
          docker push ${{secrets.DOCKER_USER}}/lifegoals:${{ github.sha }}
          docker push ${{secrets.DOCKER_USER}}/lifegoals:latest

      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
