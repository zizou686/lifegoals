<h2>Mis Metas en la Vida v2</h2>

<div>
  <input 
    type="text" 
    [(ngModel)]="nuevaMeta" 
    placeholder="Escribe una nueva meta"
    (keyup.enter)="agregarMeta()"
  />
  <button (click)="agregarMeta()">Agregar</button>
</div>

<ul>
  <li *ngFor="let meta of metas">
    {{ meta.meta }}
    <button (click)="eliminarMeta(meta.id!)">Eliminar</button>
  </li>
</ul>
